name: Bug report
description: Report reproducible behavior that is not working as documented.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve InFlow. Do not include credentials, private keys, personal data, or security vulnerabilities.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the problem and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest reproducible example, including commands or code where applicable.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Provide the affected package, application, or protocol version.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include relevant operating system, runtime, and environment details.
    validations:
      required: false
